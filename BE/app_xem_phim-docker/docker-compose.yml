name: app_xem_phim
version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: app_xem_phim
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: app_xem_phim
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: